server {
  listen 80;
  server_name _;
  client_max_body_size 25m; # invoice uploads (15 MB) and photos

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API docs (Swagger) are not for the public
  location ~ ^/api/api/ {
    return 404;
  }

  # /api/foo -> backend /foo
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # PWA: service worker and manifest must always be revalidated, otherwise updates never arrive
  location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; application/javascript js; }
  }

  # hashed build assets can be cached for a long time
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # single page app: unknown paths fall back to index.html (client-side routing)
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
